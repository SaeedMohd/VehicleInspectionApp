plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
android {
    compileSdkVersion 34
    namespace = "com.inspection"

    defaultConfig {
        applicationId "com.inspection"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 123
        versionName "3.23"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true // For older Android versions
    }


    signingConfigs {
        release {
            storeFile file("VehicleHealthMonitor.keystore")
            storePassword "surfing123"
            keyAlias "release"
            keyPassword "VhMAC@246"
        }
    }

    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
            minifyEnabled true // Enable ProGuard/R8
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions += "environment"

    flavorDimensions "environment"

    productFlavors {
        uat {
            dimension "environment"
            applicationIdSuffix ".uat"
            versionNameSuffix "-uat"
            buildConfigField "String", "FLAVOR", "\"uat\""
        }
        production {
            dimension "environment"
            versionNameSuffix "-prod"
            buildConfigField "String", "FLAVOR", "\"production\""
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/ASL2.0']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = "11"
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

configurations {
    shadowImplementation {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom implementation
    }
}

