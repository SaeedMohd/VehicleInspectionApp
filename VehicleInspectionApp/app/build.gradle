dependencies {
    // Google Play Services
    implementation 'com.google.android.gms:play-services-plus:17.0.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Google Material Design
    implementation 'com.google.android.material:material:1.11.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // Networking and JSON
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.jsoup:jsoup:1.15.3'
//    implementation 'org.json:json:20230618'

//    shadowImplementation 'org.json:json:20230618' // 2 Uncomment this one
    implementation files("$buildDir/libs/app-shadow.jar") // 1 comment this one
// 3 run command to build shadow jar "./gradlew shadowJar" then reverse 1 and 2
//    implementation 'org.json:json:20210307'
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
//    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.14.2'
//    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.2'
//    implementation 'javax.xml.stream:stax-api:1.0-2'
//    implementation 'org.codehaus.woodstox:woodstox-core:6.2.9'

    // Dialogs
    implementation 'com.github.d-max:spots-dialog:0.7@aar'

    // AWS SDK (Kotlin)
    implementation("aws.sdk.kotlin:s3:0.16.0")
    implementation("aws.sdk.kotlin:s3control:0.16.0")
    implementation("aws.sdk.kotlin:sts:0.16.0")
    implementation("aws.sdk.kotlin:secretsmanager:0.16.0")

    // UI Libraries
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    implementation 'com.github.shuhart:stepview:1.5.1'
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.1'
    implementation "com.google.android.flexbox:flexbox:3.0.0"

    // Utilities
    implementation 'com.simplify:ink:1.0.0'
    implementation 'com.itextpdf:itextg:5.5.10'
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.22'
    implementation ('io.github.softmedtanzania:maskededittext:1.0.5')
    implementation ('com.ernestoyaquello.stepperform:vertical-stepper-form:2.7.0')
    implementation 'com.bugfender.sdk:android:3.+'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.3'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.3'
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.maps.android:android-maps-utils:3.8.0'
    implementation("org.jetbrains.kotlin:kotlin-reflect")
}

tasks.register("shadowJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = "build"
    description = "Create a shadow JAR with relocated org.json library."
//    configurations = [project.configurations.shadowImplementation]
// Include the main output classes and resources
//    from("$buildDir/intermediates/classes/debug")  // Adjust this path if needed for the correct variant
    from("$buildDir/intermediates/classes/debug")  // Use `debug` or `release` as required
    from("$buildDir/intermediates/res/debug")
    // If you need to include resources, use this
//    from("$buildDir/intermediates/res/debug")
    configurations = [project.configurations.shadowImplementation]
//    configurations = [project.configurations.compileClasspath]


    dependencies {
        include(dependency("org.json:json"))
    }
    relocate("org.json", "shaded.org.json")
    archiveClassifier.set("shadow")
    destinationDirectory.set(file("$buildDir/libs"))
    archiveFileName.set("app-shadow.jar")
//    doLast {
//        copy {
//            from("$buildDir/libs/app-shadow.jar")
//            into("$buildDir/libs") // Ensure it's copied to the correct location
//        }
//    }
}


gradle.buildFinished {
    if (file("$buildDir/libs/app-shadow.jar").exists()) {
        println("Shadow JAR built successfully: $buildDir/libs/app-shadow.jar")
        dependencies {
            // Add the shadow JAR as a file dependency after the build completes
//            implementation files("$buildDir/libs/app-shadow.jar")
//            add("implementation", files("$buildDir/libs/app-shadow.jar"))
        }
    } else {
        println("Shadow JAR is missing after build.")
    }
}