plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace "com.inspection"
    compileSdk 35

    defaultConfig {
        applicationId "com.inspection"
        minSdk 24
        targetSdk 35
        versionCode 134
        versionName "3.34"

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            storeFile file("VehicleHealthMonitor.keystore")
            storePassword "surfing123"
            keyAlias "release"
            keyPassword "VhMAC@246"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            debuggable true
        }
    }

    flavorDimensions "environment"

    productFlavors {
        uat {
            dimension "environment"
            applicationIdSuffix ".uat"
            versionNameSuffix "-uat"
            buildConfigField "String", "FLAVOR", "\"uat\""
        }
        production {
            dimension "environment"
            versionNameSuffix "-prod"
            buildConfigField "String", "FLAVOR", "\"production\""
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/ASL2.0"
            ]
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {

    /* ===========================
       Google Play Services
       =========================== */
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'

    /* ===========================
       AndroidX
       =========================== */
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    /* ===========================
       Material
       =========================== */
    implementation 'com.google.android.material:material:1.13.0'

    /* ===========================
       Firebase
       =========================== */
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'

    /* ===========================
       Kotlin
       =========================== */
//    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.jetbrains.kotlin:kotlin-reflect"

    /* ===========================
       Networking & JSON
       =========================== */
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    // ❗ DO NOT add org.json dependency
    // Android framework provides org.json + XML

    /* ===========================
       UI / Utils
       =========================== */
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.github.shuhart:stepview:1.5.1'
    implementation 'com.simplify:ink:1.0.0'

    /* ===========================
       PDF
       =========================== */
    implementation 'com.itextpdf:itextg:5.5.10'
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'

    /* ===========================
       Other
       =========================== */
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.23'
    implementation 'io.github.softmedtanzania:maskededittext:1.0.5'
    implementation 'com.ernestoyaquello.stepperform:vertical-stepper-form:2.7.0'
    implementation 'com.bugfender.sdk:android:4.+'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.7'
    implementation 'org.jsoup:jsoup:1.17.2'
}

configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.12.0"
        force "androidx.core:core-ktx:1.12.0"
    }
}